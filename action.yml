name: Setup kong-harnesses
description: Install kong-harnesses from Kong
runs:
  using: node24
  main: dist/index.mjs
inputs:
  kong-harnesses-version:
    description: The version of kong-harnesses to install, for example 0.21.0. The latest release when empty.
    required: false
  token:
    description: >-
      Optional github.com token with read access to Kong/kong-harnesses for
      pinned versions absent from the public Cloudsmith repository.
    default: ${{ github.token }}
    required: false
outputs:
  version:
    description: The version of kong-harnesses that the action installed
